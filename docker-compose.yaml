services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: FCG_RabbitMQ
    ports:
      - "5672:5672"   # Porta do broker
      - "15672:15672" # Porta do painel de administração
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
 
  webapp:
    build: .
    depends_on:
      sqlserver:
        # Espera o healthcheck passar, não apenas o container iniciar.
        condition: service_healthy
      rabbitmq:
        condition: service_started
    environment:
      # Dentro do container, "localhost" é o próprio container da aplicação — o
      # appsettings.json aponta para localhost porque serve ao cenário de rodar a API
      # na máquina. Aqui o host correto é o nome do serviço do Compose.
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
    ports:
      # 8080 dos dois lados: é a porta em que o Kestrel escuta na imagem do .NET 8.
      - "8080:8080"
    # Rede de segurança: a aplicação encerra de propósito quando não consegue
    # preparar o banco, então se algo ainda assim falhar na largada o Compose tenta
    # de novo em vez de deixar o serviço fora do ar.
    restart: on-failure:3

  publisher:
      depends_on:
        - rabbitmq
      environment:
        - RabbitMq__Host=rabbitmq
        - RabbitMq__Username=guest
        - RabbitMq__Password=guest

volumes:
  sqlvolume:
