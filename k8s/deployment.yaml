apiVersion: apps/v1
kind: Deployment
metadata:
  name: fgc-notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fgc-notification
  template:
    metadata:
      labels:
        app: fgc-notification
    spec:
      containers:
        - name: fgc-notification
          image: fgc-notification:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: fgc-notification-config
            - secretRef:
                name: fgc-notification-secret
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fgc-notification
spec:
  type: ClusterIP
  selector:
    app: fgc-notification
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
